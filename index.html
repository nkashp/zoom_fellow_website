<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom Fellows Static Sites</title>
  <meta name="description" content="Local preview index for the Zoom Fellows static sites." />
  <meta http-equiv="refresh" content="0; url=./websites/nextlab-zoom-fellows/" />
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #0e2148;
      background: #eef4ff;
    }

    main {
      width: min(92vw, 720px);
      display: grid;
      gap: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.5rem;
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: #52668c;
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    a {
      padding: 18px 20px;
      border: 1px solid rgba(11, 92, 255, 0.18);
      border-radius: 14px;
      color: #0b5cff;
      background: #f9fbff;
      text-decoration: none;
      font-weight: 700;
    }

    a:focus-visible {
      outline: 3px solid #0b5cff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Zoom Fellows Static Sites</h1>
    <p>Redirecting to the landing page&hellip; if nothing happens, choose a preview below.</p>
    <div class="links">
      <a href="./websites/nextlab-zoom-fellows/">Open nextlab-zoom-fellows</a>
      <a href="./websites/zoom-momentum-website/">Open zoom-momentum-website</a>
      <a href="./websites/product-page/">Open product-page</a>
    </div>
  </main>
</body>
</html>
